<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Choose a New Password | Shopademia</title>
  <meta name="description" content="Choose a new secure password for your Shopademia account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css?v=20261113-chat-dock-v3">
  <link rel="stylesheet" href="css/consent.css?v=20261112-consent">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
  <header class="site-header">
    <div class="header-container" style="justify-content: center;">
      <a href="index.html" class="brand-logo-wrap"><img width="741" height="265" src="assets/logo-shopademia.jpg" alt="Shopademia" class="brand-logo-img"></a>
    </div>
  </header>

  <main class="page-container" style="max-width: 480px; text-align: center;">
    <section style="background: #fff; border-radius: 20px; border: 1px solid #e8e2d8; padding: 40px 32px; box-shadow: var(--shadow-md); margin-top: 24px;">
      <h1 style="font-size: 1.8rem; font-weight: 800; color: #26231f; margin-bottom: 8px;">Choose a New Password</h1>
      <p style="color: #69645b; font-size: 0.92rem; margin-bottom: 24px;">Use a password with 12 to 72 characters. This reset link can only be used once and expires after one hour.</p>
      <form id="reset-form">
        <label for="reset-password" style="display: block; text-align: left; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">New password</label>
        <input id="reset-password" type="password" required minlength="12" maxlength="72" autocomplete="new-password" style="width: 100%; border: 1px solid #d6cec1; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px;">
        <label for="reset-confirm" style="display: block; text-align: left; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">Confirm new password</label>
        <input id="reset-confirm" type="password" required minlength="12" maxlength="72" autocomplete="new-password" style="width: 100%; border: 1px solid #d6cec1; padding: 12px 14px; border-radius: 8px; margin-bottom: 20px;">
        <button id="reset-submit" type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px;">Update Password</button>
      </form>
      <p id="reset-status" role="status" aria-live="polite" style="margin-top: 16px; color: #69645b;"></p>
      <a href="login.html" style="display: inline-block; margin-top: 18px; font-size: 0.88rem; font-weight: 700; color: #302d28;">Back to Sign In</a>
    </section>
  </main>

  <script src="js/store.js?v=20261113-storefront-final-v3"></script>
  <script>
    const resetToken = new URLSearchParams(location.search).get('token') || '';
    history.replaceState(null, '', location.pathname);
    const resetForm = document.getElementById('reset-form');
    const resetStatus = document.getElementById('reset-status');
    if (!/^[a-f0-9]{64}$/i.test(resetToken)) {
      resetForm.hidden = true;
      resetStatus.textContent = 'This reset link is invalid or has expired. Request a new one.';
    }

    resetForm.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('reset-password').value;
      const confirmation = document.getElementById('reset-confirm').value;
      const submit = document.getElementById('reset-submit');
      if (password !== confirmation) {
        resetStatus.textContent = 'The passwords do not match.';
        return;
      }

      submit.disabled = true;
      resetStatus.textContent = 'Updating password...';
      try {
        const response = await fetch('/api/auth?action=reset_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not reset the password.');
        resetForm.hidden = true;
        resetStatus.textContent = 'Password updated. Redirecting to sign in...';
        setTimeout(() => { location.href = 'login.html'; }, 1200);
      } catch (error) {
        resetStatus.textContent = error.message || 'Could not connect to the account service.';
        submit.disabled = false;
      }
    });
  </script>
  <script defer src="js/consent.js?v=20261112-consent"></script>
</body>
</html>

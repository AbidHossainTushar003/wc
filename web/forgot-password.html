<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Wonderful Collection Dhaka</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="header-container" style="justify-content: center;">
      <a href="index.html" class="brand-logo-wrap"><img width="741" height="265" src="assets/logo.jpg" alt="Wonderful Collection" class="brand-logo-img"></a>
    </div>
  </header>

  <main class="page-container" style="max-width: 480px; text-align: center;">
    <div style="background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 40px 32px; box-shadow: var(--shadow-md); margin-top: 24px;">
      <div style="font-size: 3rem; margin-bottom: 12px;">🔑</div>
      <h1 style="font-size: 1.8rem; font-weight: 800; color: #0e2a47; margin-bottom: 8px;">Reset Password</h1>
      <p style="color: #64748b; font-size: 0.92rem; margin-bottom: 24px;">
        Enter your registered email address and we will send you a one-time password reset link.
      </p>

      <form onsubmit="handleForgot(event)">
        <div style="text-align: left; margin-bottom: 20px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">Email address</label>
          <input type="email" id="forgot_contact" required maxlength="150" autocomplete="email" placeholder="name@example.com" style="width: 100%; border: 1px solid #cbd5e1; padding: 12px 14px; border-radius: 8px;">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px;">
          Send Reset Instructions →
        </button>
      </form>

      <div style="margin-top: 24px;">
        <a href="login.html" style="font-size: 0.88rem; font-weight: 700; color: #f05423;">← Back to Sign In</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom"><div class="footer-bottom-container"><div>© 2026 Wonderful Collection - Dhaka, Bangladesh 🇧🇩</div></div></div>
  </footer>

  <script src="js/store.js"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const button = e.submitter;
      if (button) button.disabled = true;
      try {
        const response = await fetch('/api/auth?action=request_password_reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('forgot_contact').value.trim() })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not request a password reset.');
        Store.showToast(result.message || 'If an account exists for that email, reset instructions have been sent.');
      } catch (error) {
        Store.showToast(error.message || 'Could not connect to the account service.');
      } finally {
        if (button) button.disabled = false;
      }
    }
  </script>
</body>
</html>

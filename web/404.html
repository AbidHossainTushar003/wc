<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | Wonderful Collection Dhaka</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="header-container" style="justify-content: center;">
      <a href="index.html" class="brand-logo-wrap"><img src="assets/logo.jpg" alt="Wonderful Collection" class="brand-logo-img"></a>
    </div>
  </header>

  <main class="page-container" style="max-width: 600px; text-align: center; padding-top: 60px;">
    <div style="background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 48px 32px; box-shadow: var(--shadow-md);">
      <div style="font-size: 5rem; font-weight: 900; color: #f05423; line-height: 1; font-family: var(--font-brand);">404</div>
      <h1 style="font-size: 1.8rem; font-weight: 800; color: #0e2a47; margin: 16px 0 10px;">Page Not Found</h1>
      <p style="color: #64748b; font-size: 1rem; margin-bottom: 28px;">
        Sorry, the page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>

      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn-primary" style="padding: 12px 24px;">Back To Home</a>
        <a href="shop.html" class="btn-secondary" style="color: #0e2a47; border-color: #cbd5e1; padding: 12px 24px;">Browse Catalog</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom"><div class="footer-bottom-container"><div>© 2026 Wonderful Collection - Dhaka, Bangladesh 🇧🇩</div></div></div>
  </footer>
</body>
</html>

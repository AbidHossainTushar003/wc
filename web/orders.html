<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Shopademia</title>
  <meta name="description" content="Review your Shopademia orders and delivery progress.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css?v=20261113-chat-dock-v3">
  <link rel="stylesheet" href="css/consent.css?v=20261112-consent">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-notice">
      <span class="top-bar-badge">MY ORDERS</span>
      <span>⚡ Track your purchases and delivery progress</span>
    </div>
    <div class="top-bar-links">
      <a href="track-order.html">📍 Track Any Order</a>
    </div>
  </div>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo-wrap"><img width="741" height="265" src="assets/logo-shopademia.jpg" alt="Shopademia" class="brand-logo-img"></a>
      <div class="header-actions">
        <a href="profile.html" class="header-action-btn"><span class="icon">👤</span><span>Profile</span></a>
        <a href="cart.html" class="header-action-btn open-cart-btn"><span class="icon">🛍️</span><span>Cart</span></a>
      </div>
    </div>
  </header>

  <main class="page-container" style="max-width: 900px;">
    <h1 style="font-size: 2rem; font-weight: 800; color: #26231f; margin-bottom: 24px;">My Order History</h1>
    <details id="customer-notifications" style="background:#fff;border:1px solid #e8e2d8;border-radius:12px;padding:14px 18px;margin-bottom:20px;">
      <summary style="cursor:pointer;font-weight:800;color:#302d28;">🔔 Notifications <span id="customer-notification-count" aria-live="polite"></span></summary>
      <div id="customer-notification-list" style="margin-top:12px;">Loading notifications…</div>
    </details>
    <div id="orders-list-view">Loading orders...</div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom"><div class="footer-bottom-container"><div>© 2026 Shopademia - Dhaka, Bangladesh 🇧🇩</div><nav class="footer-social-links" aria-label="Shopademia social media"><a href="https://www.instagram.com/ShopademiaBD" target="_blank" rel="noopener noreferrer">Instagram · ShopademiaBD</a><a href="https://x.com/SHOPADEMIA" target="_blank" rel="noopener noreferrer">X · SHOPADEMIA</a><a href="https://www.facebook.com/SHOPADEMIA" target="_blank" rel="noopener noreferrer">Facebook · SHOPADEMIA</a></nav></div></div>
  </footer>

  <script src="js/store.js?v=20261113-storefront-final-v3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('orders-list-view');
      const user = Store.state.user;
      if (!user || !user.id || !user.token) {
        container.innerHTML = `
          <div style="background: #fff; border-radius: 16px; border: 1px solid #e8e2d8; padding: 48px 20px; text-align: center;">
            <p style="color: #69645b; margin-bottom: 16px;">Sign in to view your order history.</p>
            <a href="login.html" class="btn-primary">Sign In</a>
          </div>
        `;
        return;
      }

      const res = await fetch(`/api/orders?customer_id=${encodeURIComponent(user.id)}`, {
        headers: { Authorization: `Bearer ${user.token}` }
      });
      const json = await res.json();
      if (!res.ok) {
        container.textContent = json.error || 'Could not load your order history. Please sign in again.';
        return;
      }
      const orders = json.data || [];

      if (!orders.length) {
        container.innerHTML = `
          <div style="background: #fff; border-radius: 16px; border: 1px solid #e8e2d8; padding: 48px 20px; text-align: center;">
            <p style="color: #69645b; margin-bottom: 16px;">You haven't placed any orders yet.</p>
            <a href="shop.html" class="btn-primary">Start Shopping</a>
          </div>
        `;
        return;
      }

      const statusColors = {
        Pending: '#9a7a48',
        Processing: '#3b82f6',
        Shipped: '#8b5cf6',
        Delivered: '#10b981',
        Cancelled: '#ef4444'
      };
      const formatDeliveryArea = (value, fee) => {
        const area = String(value || '').trim();
        if (area === 'Local Dhaka') return 'Inside Dhaka';
        if (['Inside Dhaka', 'Outside Dhaka'].includes(area)) return area;
        return Number(fee) === 60 ? 'Inside Dhaka' : area;
      };

      container.innerHTML = orders.map(ord => {
        const orderStatus = String(ord.order_status || '');
        const statusColor = Object.prototype.hasOwnProperty.call(statusColors, orderStatus)
          ? statusColors[orderStatus]
          : '#69645b';
        const orderNumber = String(ord.order_number || '');
        return `
        <div style="background: #fff; border-radius: 16px; border: 1px solid #e8e2d8; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f3efe8; padding-bottom: 14px; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
            <div>
              <div style="font-size: 1.1rem; font-weight: 800; color: #26231f;">${Store.escapeHtml(orderNumber)}</div>
              <div style="font-size: 0.8rem; color: #69645b;">Placed on: ${new Date(ord.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <span style="background: ${statusColor}20; color: ${statusColor}; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 0.82rem;">
                ● ${Store.escapeHtml(orderStatus)}
              </span>
              <a href="track-order.html?order=${encodeURIComponent(orderNumber)}" class="btn-secondary" style="padding: 6px 12px; font-size: 0.82rem; color: #26231f; border-color: #d6cec1;">Track</a>
              <a href="/api/receipt.php?order=${encodeURIComponent(orderNumber)}&amp;track=${encodeURIComponent(String(ord.tracking_code || ''))}" target="_blank" rel="noopener noreferrer" class="btn-secondary" style="padding: 6px 12px; font-size: 0.82rem; color: #26231f; border-color: #d6cec1;">View receipt</a>
              <a href="/api/receipt.php?order=${encodeURIComponent(orderNumber)}&amp;track=${encodeURIComponent(String(ord.tracking_code || ''))}&amp;download=1" rel="noopener noreferrer" class="btn-secondary" style="padding: 6px 12px; font-size: 0.82rem; color: #26231f; border-color: #d6cec1;">Download PDF</a>
            </div>
          </div>

          <div style="margin-bottom: 14px;">
            ${(ord.items || []).map(it => `
              <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px;">
                <span>${Store.escapeHtml(it.product_name)} &times; ${Number(it.quantity) || 0}</span>
                <span style="font-weight: 700;">${Store.formatBDT(it.price * it.quantity)}</span>
              </div>
            `).join('')}
          </div>

          <div style="border-top: 1px dashed #e8e2d8; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
            <span style="color: #69645b;">Total: <strong style="color: #302d28; font-size: 1.1rem;">${Store.formatBDT(ord.total)}</strong> (${Store.escapeHtml(ord.payment_method)})</span>
            <span style="font-size: 0.82rem; color: #69645b;">Delivery to: ${Store.escapeHtml(formatDeliveryArea(ord.delivery_area, ord.delivery_fee))}</span>
          </div>
        </div>
      `;
      }).join('');
    });
  </script>
  <script src="js/orders-feedback.js?v=20261114-feedback-v1"></script>
  <script defer src="js/consent.js?v=20261112-consent"></script>
</body>
</html>

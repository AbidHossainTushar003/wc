<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Wonderful Collection Dhaka</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-notice">
      <span class="top-bar-badge">MY ORDERS</span>
      <span>⚡ Track your purchases and delivery progress</span>
    </div>
    <div class="top-bar-links">
      <a href="track-order.html">📍 Track Any Order</a>
    </div>
  </div>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo-wrap"><img width="741" height="265" src="assets/logo.jpg" alt="Wonderful Collection" class="brand-logo-img"></a>
      <div class="header-actions">
        <a href="profile.html" class="header-action-btn"><span class="icon">👤</span><span>Profile</span></a>
        <a href="cart.html" class="header-action-btn open-cart-btn"><span class="icon">🛍️</span><span>Cart</span></a>
      </div>
    </div>
  </header>

  <main class="page-container" style="max-width: 900px;">
    <h1 style="font-size: 2rem; font-weight: 800; color: #0e2a47; margin-bottom: 24px;">My Order History</h1>
    <div id="orders-list-view">Loading orders...</div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom"><div class="footer-bottom-container"><div>© 2026 Wonderful Collection - Dhaka, Bangladesh 🇧🇩</div></div></div>
  </footer>

  <script src="js/store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('orders-list-view');
      const user = Store.state.user;
      if (!user || !user.id || !user.token) {
        container.innerHTML = `
          <div style="background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 48px 20px; text-align: center;">
            <p style="color: #64748b; margin-bottom: 16px;">Sign in to view your order history.</p>
            <a href="login.html" class="btn-primary">Sign In</a>
          </div>
        `;
        return;
      }

      const res = await fetch(`/api/orders?customer_id=${encodeURIComponent(user.id)}`, {
        headers: { Authorization: `Bearer ${user.token}` }
      });
      const json = await res.json();
      if (!res.ok) {
        container.textContent = json.error || 'Could not load your order history. Please sign in again.';
        return;
      }
      const orders = json.data || [];

      if (!orders.length) {
        container.innerHTML = `
          <div style="background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 48px 20px; text-align: center;">
            <p style="color: #64748b; margin-bottom: 16px;">You haven't placed any orders yet.</p>
            <a href="shop.html" class="btn-primary">Start Shopping</a>
          </div>
        `;
        return;
      }

      const statusColors = {
        Pending: '#f59e0b',
        Processing: '#3b82f6',
        Shipped: '#8b5cf6',
        Delivered: '#10b981',
        Cancelled: '#ef4444'
      };

      container.innerHTML = orders.map(ord => {
        const orderStatus = String(ord.order_status || '');
        const statusColor = Object.prototype.hasOwnProperty.call(statusColors, orderStatus)
          ? statusColors[orderStatus]
          : '#64748b';
        const orderNumber = String(ord.order_number || '');
        return `
        <div style="background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
            <div>
              <div style="font-size: 1.1rem; font-weight: 800; color: #0e2a47;">${Store.escapeHtml(orderNumber)}</div>
              <div style="font-size: 0.8rem; color: #64748b;">Placed on: ${new Date(ord.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <span style="background: ${statusColor}20; color: ${statusColor}; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 0.82rem;">
                ● ${Store.escapeHtml(orderStatus)}
              </span>
              <a href="track-order.html?order=${encodeURIComponent(orderNumber)}" class="btn-secondary" style="padding: 6px 12px; font-size: 0.82rem; color: #0e2a47; border-color: #cbd5e1;">Track</a>
            </div>
          </div>

          <div style="margin-bottom: 14px;">
            ${(ord.items || []).map(it => `
              <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px;">
                <span>${Store.escapeHtml(it.product_name)} &times; ${Number(it.quantity) || 0}</span>
                <span style="font-weight: 700;">${Store.formatBDT(it.price * it.quantity)}</span>
              </div>
            `).join('')}
          </div>

          <div style="border-top: 1px dashed #e2e8f0; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
            <span style="color: #64748b;">Total: <strong style="color: #f05423; font-size: 1.1rem;">${Store.formatBDT(ord.total)}</strong> (${Store.escapeHtml(ord.payment_method)})</span>
            <span style="font-size: 0.82rem; color: #64748b;">Delivery to: ${Store.escapeHtml(String(ord.delivery_area || '').replace(/dhanmondi/gi, 'Dhaka'))}</span>
          </div>
        </div>
      `;
      }).join('');
    });
  </script>
</body>
</html>

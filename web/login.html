<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In or Register | Wonderful Collection Dhaka</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sign in to your Wonderful Collection account or create one to manage your orders and delivery details.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-notice">
      <span class="top-bar-badge">ACCOUNT</span>
      <span>⚡ Login or create an account for faster checkout in Dhaka, Bangladesh</span>
    </div>
  </div>

  <header class="site-header">
    <div class="header-container" style="justify-content: center;">
      <a href="index.html" class="brand-logo-wrap"><img width="741" height="265" src="assets/logo.jpg" alt="Wonderful Collection" class="brand-logo-img"></a>
    </div>
  </header>

  <main class="page-container" style="max-width: 540px;">
    <div style="background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; padding: 36px 32px; box-shadow: var(--shadow-md);">
      <h1 style="font-size: 1.7rem; font-weight: 800; color: #0e2a47; margin: 0 0 20px;">Sign in or create your account</h1>

      <!-- Tab switcher -->
      <div style="display: flex; border-bottom: 2px solid #f1f5f9; margin-bottom: 28px;">
        <button id="tab-login" onclick="switchAuthTab('login')" style="flex: 1; padding: 12px; background: none; border: none; font-weight: 800; font-size: 1.1rem; color: #f05423; border-bottom: 3px solid #f05423; cursor: pointer;">
          Sign In
        </button>
        <button id="tab-register" onclick="switchAuthTab('register')" style="flex: 1; padding: 12px; background: none; border: none; font-weight: 700; font-size: 1.1rem; color: #64748b; border-bottom: 3px solid transparent; cursor: pointer;">
          Create Account
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div style="margin-bottom: 16px;">
          <label for="login_email" style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Email Address</label>
          <input type="email" id="login_email" required placeholder="name@example.com" style="width: 100%; border: 1px solid #cbd5e1; padding: 12px 14px; border-radius: 8px;">
        </div>
        <div style="margin-bottom: 8px;">
          <label for="login_password" style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Password</label>
          <input type="password" id="login_password" required placeholder="••••••••" style="width: 100%; border: 1px solid #cbd5e1; padding: 12px 14px; border-radius: 8px;">
        </div>
        <div style="text-align: right; margin-bottom: 24px;">
          <a href="forgot-password.html" style="font-size: 0.82rem; color: #f05423; font-weight: 600;">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem;">
          Sign In To Account →
        </button>
      </form>

      <p id="auth-message" role="status" aria-live="polite" style="min-height: 1.5em; margin: 16px 0 0; color: #475569;"></p>
      <p style="font-size: 0.85rem; text-align: center; margin: 8px 0 0;">
        <a href="resend-verification.html" style="color: #f05423; font-weight: 600;">Need a new email verification link?</a>
      </p>
      <!-- Register Form -->
      <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
        <div style="margin-bottom: 14px;">
          <label for="reg_name" style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Full Name *</label>
          <input type="text" id="reg_name" required placeholder="e.g. Mahbub Alam" style="width: 100%; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 8px;">
        </div>
        <div style="margin-bottom: 14px;">
          <label for="reg_email" style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Email Address *</label>
          <input type="email" id="reg_email" required placeholder="name@example.com" style="width: 100%; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 8px;">
        </div>
        <div style="margin-bottom: 14px;">
          <label for="reg_phone" style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Mobile Phone (WhatsApp) *</label>
          <input type="tel" id="reg_phone" required pattern="01[3-9][0-9]{8}" inputmode="numeric" title="Enter an 11-digit Bangladesh mobile number starting with 013 to 019." placeholder="017XXXXXXXX" style="width: 100%; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 8px;">
        </div>
        <div style="margin-bottom: 14px;">
          <label for="reg_area" style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Delivery Area in Dhaka</label>
          <select id="reg_area" style="width: 100%; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 8px; background: #fff;">
            <option value="Dhaka" selected>Dhaka</option>
            <option value="Gulshan">Gulshan</option>
            <option value="Banani">Banani</option>
            <option value="Uttara">Uttara</option>
            <option value="Mohammadpur">Mohammadpur</option>
            <option value="Mirpur">Mirpur</option>
            <option value="Other">Other Location in Bangladesh</option>
          </select>
        </div>
        <div style="margin-bottom: 24px;">
          <label for="reg_password" style="display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px;">Choose Password *</label>
          <input type="password" id="reg_password" required minlength="12" maxlength="72" autocomplete="new-password" placeholder="12–72 characters" style="width: 100%; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 8px;">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem;">
          Create My Account 🎉
        </button>
      </form>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom"><div class="footer-bottom-container"><div>© 2026 Wonderful Collection - Dhaka, Bangladesh 🇧🇩</div></div></div>
  </footer>

  <script src="js/store.js?v=20261109"></script>
  <script>
    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('tab-login').style.color = '#f05423';
        document.getElementById('tab-login').style.borderBottomColor = '#f05423';
        document.getElementById('tab-register').style.color = '#64748b';
        document.getElementById('tab-register').style.borderBottomColor = 'transparent';
      } else {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('tab-register').style.color = '#f05423';
        document.getElementById('tab-register').style.borderBottomColor = '#f05423';
        document.getElementById('tab-login').style.color = '#64748b';
        document.getElementById('tab-login').style.borderBottomColor = 'transparent';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login_email').value.trim();
      const password = document.getElementById('login_password').value;
      const submit = e.submitter;
      if (submit) submit.disabled = true;

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', email, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
          Store.state.user = data.data;
          Store.saveState();
          Store.showToast('Welcome back, ' + data.data.name + '!');
          setTimeout(() => window.location.href = 'profile.html', 800);
        } else {
          document.getElementById('auth-message').textContent = data.error || 'Login failed.';
        }
      } catch (err) {
        document.getElementById('auth-message').textContent = 'Could not connect to authentication server.';
      } finally {
        if (submit) submit.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const payload = {
        action: 'register',
        name: document.getElementById('reg_name').value.trim(),
        email: document.getElementById('reg_email').value.trim(),
        phone: document.getElementById('reg_phone').value.trim(),
        area: document.getElementById('reg_area').value,
        password: document.getElementById('reg_password').value
      };
      const submit = e.submitter;
      if (submit) submit.disabled = true;

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          document.getElementById('auth-message').textContent = data.message;
          document.getElementById('login_email').value = payload.email;
          switchAuthTab('login');
        } else {
          document.getElementById('auth-message').textContent = data.error || 'Registration failed.';
        }
      } catch (err) {
        document.getElementById('auth-message').textContent = 'Could not connect to authentication server.';
      } finally {
        if (submit) submit.disabled = false;
      }
    }
  </script>
</body>
</html>
